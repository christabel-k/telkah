<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details</title>
  <link rel="stylesheet" href="details.css">
</head>

    <body>
      
        <div>
            <a href="index.html" class="back-btn">
       <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M73.4 297.4C60.9 309.9 60.9 330.2 73.4 342.7L233.4 502.7C245.9 515.2 266.2 515.2 278.7 502.7C291.2 490.2 291.2 469.9 278.7 457.4L173.3 352L544 352C561.7 352 576 337.7 576 320C576 302.3 561.7 288 544 288L173.3 288L278.7 182.6C291.2 170.1 291.2 149.8 278.7 137.3C266.2 124.8 245.9 124.8 233.4 137.3L73.4 297.3z"/>

        <img id="movie-poster" src="" alt="Movie Poster">


        <div class="whole-container">
        <div class="movie-info">
            <h1 id="movie-title"></h1>

            <div class="genre">
            <p><strong>Year:</strong> <span id="movie-year"></span></p>
            <p><strong>Genre:</strong> <span id="movie-genre"></span></p>
            <p><strong>⭐Rating:</strong> <span id="movie-rating"></span></p>
            </div>

            <div class="ds">
            <p id="movie-description"></p>
            <span id="more-btn">Read More</span>
            </div>
  
            <div class="trailer-container">
            <button id="watch-trailer">
              🎬Watch Trailer
            </button>
            </div>
        </div>

    </main>

    <div class="cast-cast">
    <h2>Cast</h2>
    <div id="cast-container"></div>
    </div>
</div>


    <div id="trailer-modal">
    <div class="trailer-box">

        <button id="close-trailer">
            ✕
        </button>

        <iframe id="trailer-frame" src="" allowfullscreen>
        </iframe>
    </div>
</div>

    <script src="details.js"></script>

</body>

</html>
